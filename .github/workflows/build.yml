name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version $version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Quilt jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-quilt
          path: quilt/build/libs/*.jar
          if-no-files-found: error

  # Pushing a tag like v0.1.3 publishes a pre-release with the three jars. Release immutability is on for this
  # repo, so the release starts as a draft and is published once its files are attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" jars/*.jar --draft --prerelease --verify-tag \
            --title "Steamed ${GITHUB_REF_NAME#v}" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
