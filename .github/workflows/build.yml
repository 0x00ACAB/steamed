name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches mod.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("stonecutter.properties.toml", "rb"))["mod"]["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod.version $version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Collect jars
        run: mkdir dist && cp versions/*/build/libs/steamed-*.jar dist/

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: steamed-jars
          path: dist/*.jar
          if-no-files-found: error

  # Pushing a tag like v0.1.3 publishes a pre-release with every node's jar. Release immutability is on for this
  # repo, so the release starts as a draft and is published once its files are attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: src

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Hand-written notes in .github/release-notes/<tag>.md when there are any (they're also Modrinth's changelog)
          notes="src/.github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" jars/*.jar --draft --prerelease --verify-tag \
            --title "Steamed ${GITHUB_REF_NAME#v}" "${notes_arg[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # One Modrinth version per jar, named like 0.2.0+26.2-fabric, with the GitHub release notes as the changelog
      - name: Publish to Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body -q .body > changelog.md
          src/.github/scripts/modrinth.sh jars src/stonecutter.properties.toml changelog.md
