name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod_version $version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-fabric
          path: fabric/build/libs/*.jar
          if-no-files-found: error

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-neoforge
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Quilt jar
        uses: actions/upload-artifact@v7
        with:
          name: steamed-quilt
          path: quilt/build/libs/*.jar
          if-no-files-found: error

  # Pushing a tag like v0.1.3 publishes a pre-release with the three jars. Release immutability is on for this
  # repo, so the release starts as a draft and is published once its files are attached.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true

      - uses: actions/checkout@v7
        with:
          path: src

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Hand-written notes in .github/release-notes/<tag>.md when there are any (they're also Modrinth's changelog)
          notes="src/.github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then notes_arg=(--notes-file "$notes"); else notes_arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" jars/*.jar --draft --prerelease --verify-tag \
            --title "Steamed ${GITHUB_REF_NAME#v}" "${notes_arg[@]}"
          gh release edit "$GITHUB_REF_NAME" --draft=false

      # One Modrinth version per loader, named like 0.1.3+fabric, with the GitHub release notes as the changelog
      - name: Publish to Modrinth
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mc="$(sed -n 's/^minecraft_version=//p' src/gradle.properties)"
          changelog="$(gh release view "$GITHUB_REF_NAME" --json body -q .body)"
          fabric_deps='[{"project_id":"P7dR8mSH","dependency_type":"required"},{"project_id":"Ha28R6CL","dependency_type":"required"}]'
          for loader in fabric neoforge quilt; do
            deps='[]'
            [ "$loader" != neoforge ] && deps="$fabric_deps"
            jar="steamed-$loader-$version.jar"
            data="$(jq -n --arg v "$version+$loader" --arg l "$loader" --arg mc "$mc" --arg c "$changelog" \
              --arg jar "$jar" --argjson deps "$deps" '{
                project_id: "SZuvIr1Y", name: "Steamed \($v)", version_number: $v, changelog: $c,
                version_type: "beta", loaders: [$l], game_versions: [$mc], featured: false,
                dependencies: $deps, file_parts: [$jar], primary_file: $jar}')"
            curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: 0x00ACAB/steamed (GitHub Actions)" \
              --form-string "data=$data" -F "$jar=@jars/$jar;type=application/java-archive"
            echo
          done
