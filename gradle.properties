# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.2
fabric_kotlin_version=1.14.1+kotlin.2.4.20

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge and /neoform
neoforge_version=26.2.0.88
neo_form_version=26.2-2
mdg_version=2.0.147

# Quilt Properties
# check these on https://maven.quiltmc.org/repository/release/org/quiltmc/quilt-loader/
quilt_loader_version=0.31.0-beta.4
# fabric-language-kotlin 1.14.x requires fabricloader >=0.19.5, which no stable Quilt Loader provides yet
# (0.30.1 provides 0.19.3). 1.13.14 bundles the same Kotlin 2.4.20 stdlib and only requires >=0.16.9.
quilt_fabric_kotlin_version=1.13.14+kotlin.2.4.20

# Mod Properties
# Expanded into fabric.mod.json and neoforge.mods.toml by multiloader-loader's processResources.
# Gradle reads this file as ISO-8859-1, so non-ASCII has to be \u-escaped.
mod_version=0.1.2
maven_group=xyz.kkaii.steamed
mod_name=Steamed
mod_description=Provides peer-to-peer networking via Steamworks\u2122
mod_authors=Kai Shiraishi
mod_license=CC0-1.0
mod_sources_url=https://github.com/0x00ACAB/steamed
mod_issues_url=https://github.com/0x00ACAB/steamed/issues
mod_contact_email=contact@kkaii.xyz

# Dependencies
fabric_api_version=0.161.0+26.2